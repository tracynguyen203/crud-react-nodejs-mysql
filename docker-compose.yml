# Local development stack:  docker compose up --build
services:
  crud-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crud
      MYSQL_USER: user
      MYSQL_PASSWORD: user
    ports: ["3306:3306"]
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
  crud-api:
    build: ./api
    restart: unless-stopped
    environment:
      WEB_HOST: http://localhost:3000
      DB_HOST: crud-db
      DB_USER: user
      DB_PASSWORD: user
      DB_NAME: crud
    ports: ["3001:3001"]
    depends_on:
      crud-db: { condition: service_healthy }
  crud-web:
    build: ./web
    restart: unless-stopped
    environment:
      API_URL: http://localhost:3001
    ports: ["3000:8080"]
    depends_on: [crud-api]
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: crud-db
